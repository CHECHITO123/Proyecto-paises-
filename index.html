<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora información de países de todo el mundo.">
  <title>Atlas | Buscador de países</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">ATLAS<span>.</span></a>
    <button id="themeButton" class="icon-button" aria-label="Cambiar tema">☀</button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">DESCUBRE EL PLANETA</p>
      <h1>Explora el mundo</h1>
      <p>Busca cualquier país y descubre sus datos principales.</p>
      <form id="searchForm" class="search">
        <input id="searchInput" type="search" placeholder="Ej. Japón, Venezuela, Italia..." autocomplete="off" aria-label="Nombre del país">
        <button type="submit">Buscar</button>
      </form>
    </section>

    <section class="content">
      <div class="section-heading">
        <div><p class="eyebrow">RESULTADOS</p><h2 id="resultTitle">Países destacados</h2></div>
        <button id="clearButton" class="text-button" hidden>Ver todos</button>
      </div>
      <p id="status" class="status" role="status">Cargando países...</p>
      <div id="countryGrid" class="country-grid"></div>
    </section>
  </main>

  <dialog id="countryDialog">
    <button id="closeDialog" class="dialog-close" aria-label="Cerrar">×</button>
    <div id="dialogContent"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
